<!DOCTYPE html>
<html>
<head>

    <title>MemoryCare</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
        }

        header {
            background: #24243e;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
        }

        button {
            background: #24243e;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .chat {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            white-space: pre-line;
        }

        .success {
            color: green;
            font-weight: bold;
        }

        .error {
            color: red;
            font-weight: bold;
        }

    </style>

</head>


<body>


<header>

    <h1>🧠 MemoryCare</h1>

    <p>AI Customer Support with Long-Term Memory</p>

</header>


<div class="container">


    <!-- ADD MEMORY -->

    <div class="card">

        <h2>📝 Add Customer Memory</h2>

        <label>Customer ID</label>

        <input
            id="customerId"
            placeholder="cust_101"
        >


        <label>Environment</label>

        <input
            id="environment"
            placeholder="Windows 11, Node 20"
        >


        <label>Previous Issue</label>

        <input
            id="issue"
            placeholder="Port 3000 already in use"
        >


        <label>Successful Solution</label>

        <textarea
            id="solution"
            placeholder="Killed the process using port 3000"
        ></textarea>


        <button onclick="saveMemory()">
            💾 Save Customer Memory
        </button>


        <p id="status"></p>

    </div>


    <!-- CUSTOMER SUPPORT -->

    <div class="card">

        <h2>🤖 MemoryCare Support Agent</h2>

        <label>Customer ID</label>

        <input
            id="chatCustomer"
            placeholder="cust_101"
        >


        <label>Customer Problem</label>

        <textarea
            id="question"
            placeholder="My application cannot start because port 3000 is in use."
        ></textarea>


        <button onclick="askMemoryCare()">
            🚀 Ask MemoryCare
        </button>


        <div
            id="answer"
            class="chat"
        >
            MemoryCare response will appear here.
        </div>

    </div>


</div>


<script>


async function saveMemory() {

    const customerId =
        document.getElementById("customerId").value;

    const environment =
        document.getElementById("environment").value;

    const issue =
        document.getElementById("issue").value;

    const solution =
        document.getElementById("solution").value;


    if (!customerId || !issue || !solution) {

        alert(
            "Please enter Customer ID, Issue and Solution."
        );

        return;
    }


    const response = await fetch(
        "/memory",
        {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                customer_id: customerId,

                environment: environment,

                issue: issue,

                solution: solution

            })

        }
    );


    const data = await response.json();


    const status =
        document.getElementById("status");


    if (data.success) {

        status.className = "success";

        status.innerText =
            "✅ " + data.message;

    } else {

        status.className = "error";

        status.innerText =
            "❌ " + data.message;

    }

}


async function askMemoryCare() {

    const customerId =
        document.getElementById("chatCustomer").value;

    const question =
        document.getElementById("question").value;


    if (!customerId || !question) {

        alert(
            "Please enter Customer ID and problem."
        );

        return;
    }


    const answer =
        document.getElementById("answer");


    answer.innerText =
        "🔎 Checking customer memory...";


    try {

        const response = await fetch(
            "/chat",
            {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    customer_id: customerId,

                    message: question

                })

            }
        );


        const data = await response.json();


        if (data.success) {

            answer.innerText =
                "🤖 MemoryCare:\n\n" +
                data.answer;

        } else {

            answer.innerText =
                "❌ " + data.message;

        }

    }

    catch (error) {

        answer.innerText =
            "❌ Could not connect to MemoryCare.";

    }

}


</script>


</body>
</html>
